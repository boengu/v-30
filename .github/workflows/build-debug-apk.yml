name: Build LG V30 NAVER HUD APK

# Uploading the project triggers a build. It can also be re-run from Actions.
on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Android APK + diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK command-line tools
        uses: android-actions/setup-android@v3

      - name: Install Android 35 platform and build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Validate source bundle
        run: python3 BUILD_CHECK.py

      - name: Compile pure Java tests
        run: bash tests/run_parser_smoke.sh

      - name: Build real Android debug APK
        id: build
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace assembleDebug 2>&1 | tee android-build.log

      - name: Inspect APK and calculate SHA256
        id: inspect
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          file "$APK"
          sha256sum "$APK" > app/build/outputs/apk/debug/SHA256SUMS.txt
          echo "APK: LG V30 NAVER HUD" >> "$GITHUB_STEP_SUMMARY"
          echo 'Download the artifact **LG-V30-NAVER-HUD-installable-debug-APK** below this run.' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'Warning: debug-signed APK, not production release; navigation and camera data remain unverified on device.' >> "$GITHUB_STEP_SUMMARY"
          cat app/build/outputs/apk/debug/SHA256SUMS.txt

      - name: Download real APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LG-V30-NAVER-HUD-installable-debug-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Download build log if compilation fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: HUD-APK-build-failure-log
          path: android-build.log
          if-no-files-found: ignore
          retention-days: 14
