name: Build LG V30 NAVER HUD APK

# Uploading the project triggers a build. It can also be re-run from Actions.
on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Android APK + diagnostics
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Ubuntu image provides the Android command-line tools; avoid old 'tools' package.
      - name: Install Android 35 platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          SDKROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMGR="$(command -v sdkmanager || true)"
          if [[ -z "$SDKMGR" ]]; then
            SDKMGR="$(find "$SDKROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          fi
          test -n "$SDKMGR" && test -x "$SDKMGR"
          echo "Using SDK manager: $SDKMGR"
          "$SDKMGR" --sdk_root="$SDKROOT" --install 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools' 2>&1 | tee android-sdk.log
          echo "ANDROID_HOME=$SDKROOT" >> "$GITHUB_ENV"

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Validate source bundle
        shell: bash
        run: |
          set -euo pipefail
          for f in settings.gradle build.gradle app/build.gradle app/src/main/AndroidManifest.xml app/src/main/java/com/example/phonehud/MainActivity.java app/src/main/java/com/example/phonehud/HudWire.java tests/run_parser_smoke.sh; do
            test -s "$f" || { echo "ERROR: Missing file: $f"; exit 1; }
          done
          grep -Fq 'compileSdk 35' app/build.gradle
          grep -Fq 'minSdk 24' app/build.gradle
          grep -Fq 'targetSdk 35' app/build.gradle
          echo 'PASS: V30 HUD source validated' 

      - name: Compile pure Java tests
        run: bash tests/run_parser_smoke.sh

      - name: Build real Android debug APK
        id: build
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace assembleDebug 2>&1 | tee android-build.log

      - name: Inspect APK and calculate SHA256
        id: inspect
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          file "$APK"
          sha256sum "$APK" > app/build/outputs/apk/debug/SHA256SUMS.txt
          echo "APK: LG V30 NAVER HUD" >> "$GITHUB_STEP_SUMMARY"
          echo 'Download the artifact **LG-V30-NAVER-HUD-installable-debug-APK** below this run.' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'Warning: debug-signed APK, not production release; navigation and camera data remain unverified on device.' >> "$GITHUB_STEP_SUMMARY"
          cat app/build/outputs/apk/debug/SHA256SUMS.txt

      - name: Download real APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LG-V30-NAVER-HUD-installable-debug-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Download build log if compilation fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: HUD-APK-build-failure-log
          path: |
            android-build.log
            android-sdk.log
          if-no-files-found: ignore
          retention-days: 14
